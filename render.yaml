services:
  - type: web
    name: rolitsex2-private
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_CA_CERT
        sync: false
      - key: ACCESS_USERNAME
        value: player
      - key: ACCESS_PASSWORD
        sync: false
