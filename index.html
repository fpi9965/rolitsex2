<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 روليت الإثارة - الإصدار المصحح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: #0a0a0f; min-height: 100vh; overflow-x: hidden; }
        .bg-ambient {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 60% 40% at 20% 10%, rgba(236,72,153,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 35% at 80% 80%, rgba(168,85,247,0.15) 0%, transparent 70%);
        }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .glass-pink { background: rgba(236,72,153,0.07); backdrop-filter: blur(20px); border: 1px solid rgba(236,72,153,0.2); }
        .fancy-input {
            width: 100%; padding: 1rem 1.2rem; background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(236,72,153,0.25); border-radius: 16px; color: #fff;
            font-size: 1.05rem; outline: none; transition: all .3s;
        }
        .fancy-input:focus { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236,72,153,0.15); }
        .btn-primary {
            background: linear-gradient(135deg, #be185d, #ec4899, #a855f7);
            background-size: 200% 200%; animation: gradientShift 4s ease infinite;
            border: none; border-radius: 20px; padding: 1.5rem; font-weight: 800; color: white;
            cursor: pointer; box-shadow: 0 4px 30px rgba(236,72,153,0.35); transition: transform .2s;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        @keyframes gradientShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        .wheel-wrapper { position: relative; width: 220px; height: 220px; margin: 0 auto; }
        .wheel-ring {
            position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(#ec4899 0deg 60deg, #a855f7 60deg 120deg, #f43f5e 120deg 180deg, #ec4899 180deg 240deg, #a855f7 240deg 300deg, #f43f5e 300deg 360deg);
            box-shadow: 0 0 40px rgba(236,72,153,0.5); transition: transform 3.2s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .wheel-center {
            position: absolute; inset: 25px; border-radius: 50%; background: radial-gradient(circle, #1a0a1e, #0d0010);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid rgba(236,72,153,0.3);
        }
        .wheel-arrow {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            font-size: 2rem; filter: drop-shadow(0 0 8px #ec4899); animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-5px); } }
        
        .result-card { animation: slideUp .5s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .stage-pill {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 50px;
            font-size: .8rem; font-weight: 700; background: rgba(236,72,153,0.15);
            border: 1px solid rgba(236,72,153,0.3); color: #f9a8d4;
        }
        .stage-badge { background: #ec4899; color: #fff; border-radius: 50px; padding: 2px 8px; font-size: .7rem; }
        
        .btn-spin {
            background: linear-gradient(135deg, #fff, #fce7f3); color: #be185d; border: none; border-radius: 14px;
            padding: 12px 32px; font-weight: 900; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 20px rgba(236,72,153,0.3);
            transition: transform .2s;
        }
        .btn-spin:hover { transform: scale(1.05); }
        .btn-spin:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        
        .btn-action {
            border-radius: 14px; font-weight: 700; font-size: .82rem; padding: .9rem .4rem;
            cursor: pointer; border: none; transition: transform .2s; color: white;
        }
        .btn-action:hover { transform: translateY(-2px); }
        .command-text {
            font-size: 1.15rem; line-height: 2; background: rgba(0,0,0,0.4); border-radius: 16px;
            padding: 1.5rem; text-align: center; color: #f3f4f6; border: 1px solid rgba(255,255,255,0.06);
        }
        .turn-display {
            background: linear-gradient(135deg, rgba(236,72,153,0.1), rgba(168,85,247,0.1));
            border: 1px solid rgba(236,72,153,0.2); border-radius: 16px; padding: 14px 20px;
            text-align: center; font-weight: 700; color: white;
        }
        .neon-title { text-shadow: 0 0 20px #ec4899, 0 0 40px rgba(236,72,153,0.5); }
        
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ec4899, #a855f7); width: 0%; transition: width 0.5s ease; }
        
        .shake { animation: shake .4s ease; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
        
        .confetti-piece {
            position: fixed; pointer-events: none; z-index: 999; width: 10px; height: 10px; border-radius: 2px;
            animation: confettiFall 2.5s ease-in forwards;
        }
        @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        .logo-emoji { display: inline-block; animation: logoPulse 2s ease-in-out infinite; }
        @keyframes logoPulse { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(-5deg); } }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div class="relative z-10 max-w-md mx-auto p-4 pb-12">
        <div class="text-center py-8">
            <div class="text-5xl mb-3"><span class="logo-emoji">🔥</span></div>
            <h1 class="text-3xl font-black neon-title text-white mb-2">روليت الإثارة</h1>
            <p class="text-pink-400 text-sm font-medium">باقة جنسية صريحة · ليلة مثيرة جداً</p>
        </div>

        <!-- SETUP -->
        <div id="setup">
            <div class="glass rounded-3xl p-7 mb-6">
                <h2 class="text-xl font-bold text-center mb-7 text-pink-300">✨ أدخل معلوماتكما</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block mb-2 text-pink-200 text-sm font-semibold">اسم الزوج</label>
                        <input id="p1name" type="text" value="الزوج" class="fancy-input">
                    </div>
                    <div style="height:1px; background: linear-gradient(to left, transparent, rgba(236,72,153,0.3), transparent);"></div>
                    <div>
                        <label class="block mb-2 text-pink-200 text-sm font-semibold">اسم الزوجة</label>
                        <input id="p2name" type="text" value="الزوجة" class="fancy-input">
                    </div>
                </div>
            </div>
            <button onclick="startGame()" class="btn-primary w-full text-xl">ابدأ الليلة الساخنة 🔥</button>
        </div>

        <!-- GAME -->
        <div id="game" class="hidden">
            <div class="flex justify-between items-center mb-5">
                <button onclick="showSetup()" class="glass px-4 py-2 rounded-xl text-sm text-pink-300 font-semibold hover:bg-white/10 transition-colors">← تعديل الأسماء</button>
                <div id="stageTitle" class="stage-pill"></div>
            </div>
            <div id="currentTurn" class="turn-display mb-4"></div>
            <div class="progress-container mb-4"><div class="progress-bar" id="progressBar"></div></div>

            <div class="glass-pink rounded-3xl p-6 flex flex-col items-center">
                <div class="wheel-wrapper mb-5">
                    <div class="wheel-arrow">🔻</div>
                    <div class="wheel-ring" id="wheelRing"></div>
                    <div class="wheel-center">
                        <span style="font-size:2.5rem;">🎰</span>
                        <span class="text-pink-300 text-xs font-bold mt-1">دور!</span>
                    </div>
                </div>
                <button class="btn-spin" id="spinBtn" onclick="spinRoulette()">🎲 لف الروليت</button>
            </div>

            <div id="result" class="hidden mt-6 result-card">
                <div class="relative glass-pink rounded-3xl p-7">
                    <div id="playerName" class="text-2xl font-black text-center mb-5"></div>
                    <div id="commandText" class="command-text"></div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mt-6">
                <button onclick="newCommand()" class="btn-action" style="background:linear-gradient(135deg,#7c3aed,#a855f7)">🎯<br>أمر جديد</button>
                <button onclick="changeStage()" class="btn-action" style="background:linear-gradient(135deg,#be185d,#ec4899)">⚡<br>التالي</button>
                <button onclick="resetDailyPool()" class="btn-action" style="background:linear-gradient(135deg,#991b1b,#ef4444)">🔄<br>باقة جديدة</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================================================
        // قاعدة البيانات المصححة (خالية من الأخطاء الإملائية والنحوية)
        // ========================================================================
        const masterStages = {
            1: [ // أسئلة صريحة
                { مذكر: "ما هو أكثر خيال جنسي يراودك عندما تلمس قضيبي؟", مؤنث: "ما هو أكثر خيال جنسي يراودك عندما ألمس كسكِ؟" },
                { مذكر: "هل تفضل نكاح كس زوجتك بقوة وعنف أم ببطء وحنان؟", مؤنث: "هل تفضلين أن أنكح كسكِ بقوة وعنف أم ببطء وحنان؟" },
                { مذكر: "كم مرة في الليلة تتمنى أن تقذف داخل كسها؟", مؤنث: "كم مرة في الليلة تتمنين أن أقذف داخلكِ؟" },
                { مذكر: "ما هو الجزء الأكثر إثارة في جسد زوجتك العاري؟", مؤنث: "ما هو الجزء الأكثر إثارة في جسدي العاري بالنسبة لك؟" },
                { مذكر: "هل تستمتع برؤية زوجتك وهي تلمس كسها أمامك؟", مؤنث: "هل تستمتعين برؤيتي وأنا ألمس كسي أمامك؟" },
                { مذكر: "ما هي الكلمة القذرة التي تحب أن تسمعها من زوجتك أثناء النكاح؟", مؤنث: "ما هي الكلمة القذرة التي تحب أن تسمعها مني أثناء النكاح؟" },
                { مذكر: "هل تفضل مص قضيبك أم لحس كس زوجتك أكثر؟", مؤنث: "هل تفضلين مص قضيبي أم أن ألحس كسكِ أكثر؟" },
                { مذكر: "ما هو العطر المفضل لديك على جسد زوجتك؟", مؤنث: "ما هو العطر الذي يجعلك تريد نكاحي فوراً؟" },
                { مذكر: "هل تحب رؤية قضيبك وهو ينتصب أمام زوجتك؟", مؤنث: "هل تحبين رؤية قضيبي وهو ينتصب أمامكِ؟" },
                { مذكر: "ما هو أكثر مكان في المنزل تتمنى نكاح زوجتك فيه؟", مؤنث: "ما هو أكثر مكان في المنزل تتمنين أن أنكحكِ فيه؟" },
                { مذكر: "هل تفضل أن تكون مسيطراً أثناء النكاح أم منقاداً؟", مؤنث: "هل تفضلين أن أكون مسيطراً أثناء النكاح أم منقاداً لكِ؟" },
                { مذكر: "كم من الوقت تفضل أن يستمر نكاح الكس قبل القذف؟", مؤنث: "كم من الوقت تفضلين أن يستمر نكاح كسي قبل أن تقذف؟" },
                { مذكر: "هل تستمتع بسماع صوت صراخ زوجتك وأنت تنكحها؟", مؤنث: "هل تستمتعين بسماع صوت صراخك وأنت تنكحيني؟" },
                { مذكر: "هل تحب أن تلمس مؤخرة زوجتك وأنت تنكحها؟", مؤنث: "هل تحبين أن ألمس مؤخرتكِ وأنا أنكحكِ؟" },
                { مذكر: "ما هو تقييمك لشهوتك من 1 إلى 10؟", مؤنث: "ما هو تقييمك لشهوتك من 1 إلى 10؟" },
                { مذكر: "هل تفضل أن ترى زوجتك عارية تماماً أم بملابس داخلية مثيرة؟", مؤنث: "هل تفضلين أن أراك عارياً تماماً أم بملابس داخلية مثيرة؟" },
                { مذكر: "هل تحب أن أمسك قضيبك وأفركه أمامك؟", مؤنث: "هل تحبين أن أمسك كسكِ وأفركه أمامكِ؟" },
                { مذكر: "ما هو أكثر جزء في جسدك تحب أن تلمسه زوجتك؟", مؤنث: "ما هو أكثر جزء في جسدك تحب أن ألمسه؟" },
                { مذكر: "هل تفضل الاستحمام مع زوجتك قبل النكاح أم بعده؟", مؤنث: "هل تفضلين الاستحمام معي قبل النكاح أم بعده؟" },
                { مذكر: "هل تحب أن تسمع زوجتك تطلب منك أن تنكحها بوقاحة؟", مؤنث: "هل تحبين أن أطلب منك أن تنكحني بوقاحة؟" },
                { مذكر: "هل تفضل نكاح الكس وأنت واقف أم مستلقي؟", مؤنث: "هل تفضلين أن أنكحكِ وأنا واقف أم مستلقي؟" },
                { مذكر: "هل تحب أن تذوق طعم كس زوجتك بعد النكاح؟", مؤنث: "هل تحبين أن تذوق طعم كسي بعد النكاح؟" },
                { مذكر: "ما هي أكثر ليلة جنسية لا تنسى بالنسبة لك؟", مؤنث: "ما هي أكثر ليلة جنسية لا تنسى بالنسبة لك؟" },
                { مذكر: "هل تفضل النوم عارياً بجانب زوجتك؟", مؤنث: "هل تفضلين النوم عارية بجانبي؟" },
                { مذكر: "هل يثيرك أن ترى زوجتك تلمس بظرها أمامك؟", مؤنث: "هل يثيركِ أن تراني ألمس بظري أمامكِ؟" },
                { مذكر: "هل تحب أن تقذف على صدر زوجتك؟", مؤنث: "هل تحبين أن أقذف على صدركِ؟" },
                { مذكر: "هل تفضل أن تكون العلاقة الجنسية صامتة أم بكلمات مثيرة؟", مؤنث: "هل تفضلين أن تكون العلاقة صامتة أم بكلمات مثيرة؟" },
                { مذكر: "ما هو أكثر شيء يثير قضيبك فوراً؟", مؤنث: "ما هو أكثر شيء يثير كسكِ فوراً؟" },
                { مذكر: "هل تحب أن تلمس شعر زوجتك أثناء النكاح؟", مؤنث: "هل تحبين أن ألمس شعركِ أثناء النكاح؟" },
                { مذكر: "هل تفضل نكاح الكس في السرير أم على الأرض؟", مؤنث: "هل تفضلين أن أنكحكِ في السرير أم على الأرض؟" },
                { مذكر: "هل تحب أن تنظر في عيني زوجتك وأنت تقذف؟", مؤنث: "هل تحبين أن تنظر في عيني وأنت تقذف؟" },
                { مذكر: "ما هو حجم قضيبك الذي تفضل أن تكون عليه؟", مؤنث: "ما هو حجم قضيبي الذي تفضلينه؟" },
                { مذكر: "هل تفضل إضاءة خافتة أم مظلمة أثناء النكاح؟", مؤنث: "هل تفضلين إضاءة خافتة أم مظلمة أثناء النكاح؟" },
                { مذكر: "هل تستمتع بفرك قضيبك على كس زوجتك قبل الإدخال؟", مؤنث: "هل تستمتعين بفرك قضيبي على كسكِ قبل الإدخال؟" },
                { مذكر: "هل تفضل أن تبدأ أنت أم زوجتك بالمبادرة الجنسية؟", مؤنث: "هل تفضلين أن تبدأ أنت أم أنا بالمبادرة؟" },
                { مذكر: "ما هو شعورك عندما تلمس نهود زوجتك؟", مؤنث: "ما هو شعورك عندما ألمس نهودكِ؟" },
                { مذكر: "هل تحب أن تسمع زوجتك تئن وأنت تنكحها؟", مؤنث: "هل تحبين أن تسمع أنيني وأنت تنكحيني؟" },
                { مذكر: "هل تفضل نكاح الكس الطويل أم القصير والمكثف؟", مؤنث: "هل تفضلين نكاح الكس الطويل أم القصير والمكثف؟" },
                { مذكر: "هل تحب أن تطلب من زوجتك أن ترتدي ملابس مثيرة؟", مؤنث: "هل تحبين أن تطلب مني أن أرتدي ملابس مثيرة؟" },
                { مذكر: "هل يثيرك النظر إلى كس زوجتك المبلل؟", مؤنث: "هل يثيركِ النظر إلى قضيبي المنتصب؟" },
                { مذكر: "هل تفضل القذف داخل كس زوجتك أم على بطنها؟", مؤنث: "هل تفضلين أن أقذف داخل كسكِ أم على بطنكِ؟" },
                { مذكر: "هل تحب أن تشم رائحة كس زوجتك قبل النكاح؟", مؤنث: "هل تحبين أن تشم رائحة كسي قبل النكاح؟" },
                { مذكر: "هل تفضل أن تكون زوجتك صاخبة أم هادئة أثناء النكاح؟", مؤنث: "هل تفضلين أن أكون صاخباً أم هادئاً أثناء النكاح؟" },
                { مذكر: "ما هي النظرة التي تثير قضيبك أكثر؟", مؤنث: "ما هي النظرة التي تثير كسكِ أكثر؟" },
                { مذكر: "هل تفضل أن تلمس زوجتك قضيبك بيديها أم بفمها؟", مؤنث: "هل تفضلين أن ألمس كسكِ بيدي أم بلساني؟" },
                { مذكر: "هل تحب أن تنام بعد النكاح مباشرة أم ترغب في المزيد؟", مؤنث: "هل تحبين أن تنامي بعد النكاح مباشرة أم ترغبين في المزيد؟" },
                { مذكر: "ما هو أكثر شيء تتمنى أن تفعله مع زوجتك الآن؟", مؤنث: "ما هو أكثر شيء تتمنى أن أفعله معك الآن؟" },
                { مذكر: "هل يثيرك أن ترى زوجتك وهي تستمني أمامك؟", مؤنث: "هل يثيركِ أن تراني وأنا أستمني أمامكِ؟" },
                { مذكر: "هل تحب أن تسمع زوجتك تهمس باسمك أثناء النكاح؟", مؤنث: "هل تحبين أن تسمع اسمك وهمساً أثناء النكاح؟" }
            ],
            2: [ // أوامر مثيرة
                "قبل شريكك قبلة عميقة وبطيئة لمدة دقيقة كاملة دون انقطاع.",
                "عض شفة شريكك السفلية برفق ومصها وأنت تنظر في عينيه.",
                "اهمس في أذن شريكك بأكثر جملة قذرة يمكنك تخيلها.",
                "انزع ملابس شريكك العلوية ببطء باستخدام أسنانك فقط.",
                "مرر يدك ببطء من صدر شريكك وصولاً إلى منطقة العانة فوق الملابس.",
                "قبّل رقبة شريكك واترك علامة مص حمراء واضحة.",
                "اجلس في حضن شريكك وحرك جسمك ببطء ملامساً إياه.",
                "خذ يد شريكك وضعها على قضيبك المنتصب أو كسكِ المبلل.",
                "انظر في عيني شريكك لمدة 30 ثانية دون أن ترمش ثم قبله بعنف.",
                "اربط يدي شريكك بوشاح أو حزام وقبّل جسده بالكامل.",

        // ========================================================================
        // منطق اللعبة
        // ========================================================================
        let dailyStages = {1: [], 2: [], 3: [], 4: []};
        let usedInDaily = {1: new Set(), 2: new Set(), 3: new Set(), 4: new Set()};
        let players = [];
        let currentStage = 1;
        let currentPlayerIndex = 0;
        let isSpinning = false;
        let currentRotation = 0;

        function generateDailyPool(forceReset = false) {
            let history = JSON.parse(localStorage.getItem('roulette_history')) || {1:[],2:[],3:[],4:[]};
            if (forceReset) {
                history = {1:[],2:[],3:[],4:[]};
                localStorage.setItem('roulette_history', JSON.stringify(history));
            }
            for (let s = 1; s <= 4; s++) {
                let limit = (s === 4) ? 1 : 8;
                let allItems = masterStages[s];
                let unplayedIndexes = [];
                allItems.forEach((item, index) => {
                    if (!history[s].includes(index)) unplayedIndexes.push(index);
                });
                if (unplayedIndexes.length < limit) {
                    history[s] = [];
                    localStorage.setItem('roulette_history', JSON.stringify(history));
                    unplayedIndexes = allItems.map((_, i) => i);
                }
                unplayedIndexes.sort(() => Math.random() - 0.5);
                let chosenIndexes = unplayedIndexes.slice(0, limit);
                dailyStages[s] = chosenIndexes.map(idx => ({ originalIndex: idx, content: allItems[idx] }));
                usedInDaily[s].clear();
            }
        }

        function startGame() {
            const p1 = { name: document.getElementById('p1name').value.trim() || "الزوج", gender: "مذكر" };
            const p2 = { name: document.getElementById('p2name').value.trim() || "الزوجة", gender: "مؤنث" };
            players = [p1, p2];
            localStorage.setItem('roulette_p1', JSON.stringify(p1));
            localStorage.setItem('roulette_p2', JSON.stringify(p2));

            currentStage = 1;
            currentPlayerIndex = Math.floor(Math.random() * 2);
            generateDailyPool(false);

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            updateStageTitle();
            document.getElementById('result').classList.add('hidden');
            updateTurnDisplay();
            updateProgress();
        }

        function updateStageTitle() {
            let total = dailyStages[currentStage].length;
            let currentLeft = total - usedInDaily[currentStage].size;
            let stageNames = { 1:"🌶️ صريح", 2:"🔥 مثير", 3:"💋 مداعبة", 4:"🛏️ وضعيات" };
            document.getElementById('stageTitle').innerHTML =
                `${stageNames[currentStage]} <span class="stage-badge">المتبقي: ${currentLeft}</span>`;
        }

        function updateTurnDisplay() {
            const player = players[currentPlayerIndex];
            document.getElementById('currentTurn').innerHTML =
                `الدور على: <span style="color:#ec4899" class="font-extrabold">${player.name}</span> ✨`;
        }

        function updateProgress() {
            const total = dailyStages[currentStage].length;
            const used = usedInDaily[currentStage].size;
            const percentage = total > 0 ? (used / total) * 100 : 0;
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        // ========================================================================
        // الدالة الذكية: تختار النص الصحيح بناءً على جنس اللاعب
        // ========================================================================
        function getCommandForPlayer(cmdObj, player) {
            if (typeof cmdObj === 'object' && cmdObj.مذكر && cmdObj.مؤنث) {
                return player.gender === "مذكر" ? cmdObj.مذكر : cmdObj.مؤنث;
            }
            let text = cmdObj;
            if (player.gender === "مذكر") {
                text = text.replace(/شريكك/g, "زوجتك").replace(/زوجك/g, "زوجتك");
            } else {
                text = text.replace(/شريكك/g, "زوجك").replace(/زوجتك/g, "زوجك");
            }
            return text;
        }

        function spinRoulette() {
            if (isSpinning) return;
            const player = players[currentPlayerIndex];
            const pool = dailyStages[currentStage];
            let available = pool.filter((_, i) => !usedInDaily[currentStage].has(i));

            if (available.length === 0) {
                const btn = document.getElementById('spinBtn');
                btn.classList.add('shake');
                setTimeout(() => btn.classList.remove('shake'), 400);
                document.getElementById('result').classList.add('hidden');
                document.getElementById('playerName').innerHTML =
                    `<span style="color:#f87171;font-size:1rem">انتهت أوامر هذه المرحلة! انتقل للمرحلة التالية ⚡</span>`;
                document.getElementById('result').classList.remove('hidden');
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.textContent = '⏳ يدور...';
            document.getElementById('result').classList.add('hidden');

            const randomObj = available[Math.floor(Math.random() * available.length)];
            const itemIndexInPool = pool.indexOf(randomObj);
            usedInDaily[currentStage].add(itemIndexInPool);

            let history = JSON.parse(localStorage.getItem('roulette_history')) || {1:[],2:[],3:[],4:[]};
            if (!history[currentStage].includes(randomObj.originalIndex)) {
                history[currentStage].push(randomObj.originalIndex);
                localStorage.setItem('roulette_history', JSON.stringify(history));
            }

            // الحصول على النص الصحيح
            const finalCmd = getCommandForPlayer(randomObj.content, player);

            const extraSpins = (Math.floor(Math.random() * 5) + 6) * 360;
            currentRotation += extraSpins + Math.floor(Math.random() * 360);
            const wheel = document.getElementById('wheelRing');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            if ('vibrate' in navigator) {
                setTimeout(() => { navigator.vibrate([100, 50, 100]); }, 2800);
            }

            setTimeout(() => {
                document.getElementById('playerName').innerHTML =
                    `🎯 <span style="color:#ec4899" class="font-black">${player.name}</span>`;
                document.getElementById('commandText').textContent = finalCmd;
                const resultEl = document.getElementById('result');
                resultEl.classList.remove('hidden');
                resultEl.classList.remove('result-card');
                void resultEl.offsetWidth;
                resultEl.classList.add('result-card');

                for(let i=0; i<20; i++) {
                    const c = document.createElement('div');
                    c.className = 'confetti-piece';
                    c.style.cssText = `left:${Math.random()*100}vw; top:0; background:${['#ec4899','#a855f7','#f43f5e','#fbbf24','#34d399'][Math.floor(Math.random()*5)]}; border-radius:${Math.random()>.5?'50%':'2px'}; width:${6+Math.random()*8}px; height:${6+Math.random()*8}px; animation-delay:${Math.random()*.5}s; animation-duration:${1.5+Math.random()*1.5}s;`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }

                currentPlayerIndex = currentPlayerIndex === 0 ? 1 : 0;
                updateTurnDisplay();
                updateStageTitle();
                updateProgress();

                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = '🎲 لف الروليت';
            }, 3300);
        }

        function newCommand() { if (isSpinning) return; document.getElementById('result').classList.add('hidden'); spinRoulette(); }
        function changeStage() { if (isSpinning) return; currentStage = currentStage === 4 ? 1 : currentStage + 1; updateStageTitle(); updateProgress(); document.getElementById('result').classList.add('hidden'); updateTurnDisplay(); }
        function resetDailyPool() { if (isSpinning) return; if (confirm("هل ترغب في سحب باقة يومية جديدة (8 أسئلة جديدة لكل مرحلة) دون تكرار ما لعبتوه سابقاً؟")) { generateDailyPool(true); currentStage = 1; updateStageTitle(); updateProgress(); document.getElementById('result').classList.add('hidden'); } }
        function showSetup() { if (isSpinning) return; document.getElementById('setup').classList.remove('hidden'); document.getElementById('game').classList.add('hidden'); }

        window.onload = function() {
            const p1 = localStorage.getItem('roulette_p1');
            const p2 = localStorage.getItem('roulette_p2');
            if (p1 && p2) {
                document.getElementById('p1name').value = JSON.parse(p1).name;
                document.getElementById('p2name').value = JSON.parse(p2).name;
            }
        };
    </script>
</body>
</html>
